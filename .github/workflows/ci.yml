# Verify, then publish. The deploy job re-uses the exact dist/ the checks ran against —
# a rebuild could differ from what was verified, and a pipeline that allows that is not
# telling you anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A superseded pull-request run is cancelled; runs on main queue behind
# each other instead, so two pushes cannot race their force-pushes to gh-pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # base=/ob-training/ — a Pages project site is served from a subpath. The build that
      # gets verified has to be the build that ships, so this is `build:pages`, not `build`.
      - run: npm run build:pages

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the gh-pages branch
    environment:
      name: production
      url: https://www.matejkala.com/ob-training/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # No checkout: gh-pages holds the build and nothing else, so a fresh repo made out of
      # dist/ is the whole commit. Same shape as scripts/deploy-pages.mjs, which stays as
      # the manual escape hatch.
      - name: Push dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Without this, Pages runs the output through Jekyll, which silently drops any
          # file or directory whose name begins with an underscore.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "deploy ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
